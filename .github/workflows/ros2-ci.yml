name: ROS 2 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/ubuntu-noble-ros-jazzy-ros-base
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test package
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          package-name: quadcontrol_core
          target-ros2-distro: jazzy

  sanitizers:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/ubuntu-noble-ros-jazzy-ros-base
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install package dependencies
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to quadcontrol_core \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug -DQUADCONTROL_ENABLE_SANITIZERS=ON

      - name: Run tests with sanitizers
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --packages-select quadcontrol_core --event-handlers console_direct+
          colcon test-result --verbose

  coverage:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/ubuntu-noble-ros-jazzy-ros-base
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install coverage and package dependencies
        run: |
          apt-get update
          apt-get install --yes gcovr
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy

      - name: Build with coverage instrumentation
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to quadcontrol_core \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug -DQUADCONTROL_ENABLE_COVERAGE=ON

      - name: Run tests and generate coverage report
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --packages-select quadcontrol_core --event-handlers console_direct+
          colcon test-result --verbose
          gcovr --root . --filter 'src/quadcontrol_core/(src|include)/.*' \
            --txt-summary --xml-pretty --xml coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadcontrol-coverage
          path: coverage.xml
          if-no-files-found: ignore